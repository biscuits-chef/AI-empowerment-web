name: 前端质量门禁

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - name: 安装依赖
        run: npm ci --ignore-scripts
      - name: 执行完整质量门禁
        run: npm run verify
      - name: 构建容器镜像
        run: docker build --tag intelligent-qa-web:${{ github.sha }} .
