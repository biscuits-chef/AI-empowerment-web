services:
  intelligent-qa-web:
    build: .
    image: intelligent-qa-web:1.0.0
    ports:
      - '8081:8080'
    environment:
      APP_PROFILE: dev
      BACKEND_UPSTREAM: http://host.docker.internal:8080
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=32m,uid=101,gid=101
      - /var/run:size=4m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
